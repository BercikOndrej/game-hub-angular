<ul class="w-full">
  @if (this.httpResourceStore.areGenresLoading()) {
    <p>Genres are loading</p>
  }
  @if (this.httpResourceStore.genresError()) {
    <p>Error occures? {{ this.httpResourceStore.genresError()?.message }}</p>
  }
  @for (genre of this.genres(); track genre.id) {
    <li>
      <app-card
        [isClickable]="true"
        [isSelected]="selectedGenreId() === genre.id"
        (cardClick)="confirmSelect(genre.id)"
        class="rounded-l-none"
      >
        <div class="body flex gap-2 p-4">
          <img class="rounded-md w-8 h-8" [src]="genre.backgroundImage" alt="Genre image" />
          <p class="text-xl text-bold">{{ genre.name }}</p>
        </div>
      </app-card>
    </li>
  }
</ul>
