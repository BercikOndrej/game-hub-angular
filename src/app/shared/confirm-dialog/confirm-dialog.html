<div class="rounded-xl p-4 space-y-4 bg-white">
  <h2>{{ data.title }}</h2>
  <p>{{ data.message }}</p>
  <div class="flex justify-between items-center">
    <app-button (click)="dialogRef.close(false)">Cancel</app-button>
    <app-button (click)="dialogRef.close(true)">Confirm</app-button>
  </div>
</div>
