<ng-template cdkPortal>
  <ul
    cdkListbox
    cdkListboxMultiple
    [attr.aria-label]="name()"
    [cdkListboxValue]="selected()"
    (cdkListboxValueChange)="onItemsChange($event)"
    class="overlay-container"
  >
    @for (item of items(); track item.id) {
      <li
        class="overlay-container__item"
        [class.overlay-container__item--selected]="selected().includes(item.id)"
        [cdkOption]="item.id"
      >
        {{ item.name }}
        @if (selected().includes(item.id)) {
          <ng-icon name="faSolidCheck" />
        }
      </li>
    }
  </ul>
</ng-template>

<app-button ariaHasPopup="listbox" [ariaExpanded]="isOpen()" (click)="onOpen()">
  <span>{{ nameLabel() }}</span>
  <ng-icon [name]="isOpen() ? 'faSolidChevronUp' : 'faSolidChevronDown'" class="select-arrow" />
</app-button>
