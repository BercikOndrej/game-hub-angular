<div
  class="bg-gray-200 rounded-xl hover:bg-gray-300 transform duration-300 flex items-center gap-2 focus-within:border focus-within:border-black"
>
  <mat-icon class="ml-4">search</mat-icon>
  <input
    class="w-full p-2 border-0 focus:border-0 focus:outline-none"
    [(ngModel)]="value"
    (keyup.enter)="searchGames()"
    matsInput
    maxlength="256"
    placeholder="Search..."
  />
  <mat-hint class="w-24 text-gray-500" align="end">{{ value().length }}/256</mat-hint>
</div>
