<mat-icon>search</mat-icon>
<input
  #searchInput
  class="search-input"
  [(ngModel)]="value"
  (keyup.enter)="searchGames()"
  matsInput
  maxlength="256"
  placeholder="Search..."
/>
<mat-hint class="search-hint" align="end">{{ value().length }}/256</mat-hint>
@if (searchInput.value.length > 0) {
  <mat-icon class="clickable" (click)="clearAndFocusInput()">close</mat-icon>
}
